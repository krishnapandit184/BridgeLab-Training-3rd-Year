<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>
    <h1>Our Pricing Plans</h1>

    <main class="pricing-container">
        <section class="price-card">
            <h2>Basic</h2>
            <h3>₹499/month</h3>
            <p>5 Projects</p>
            <p>Basic Support</p>
            <p>10GB Storage</p>
            <button>Choose Plan</button>
        </section>

        <section class="price-card popular">
            <h2>Standard</h2>
            <h3>₹999/month</h3>
            <p>20 Projects</p>
            <p>Priority Support</p>
            <p>50GB Storage</p>
            <button>Choose Plan</button>
        </section>

        <section class="price-card">
            <h2>Premium</h2>
            <h3>₹1499/month</h3>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <p>100GB Storage</p>
            <button>Choose Plan</button>
        </section>
    </main>
</body>
</html>
