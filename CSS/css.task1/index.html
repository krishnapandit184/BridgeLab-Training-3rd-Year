<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="profile">
            <div class="avatar">Student</div>
        </div>

        <h2>Rahul Sharma</h2>
        <h3>Computer Science Engineering</h3>
        <h4>ABC Institute of Technology</h4>

        <p>
            I am a passionate Computer Science student interested in
            Web Development, Java, and problem solving.
        </p>

        <h2 class="skill-title">Skills</h2>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>Problem Solving</span>
        </div>

        <button>Contact Me</button>
    </div>

</body>
</html>
