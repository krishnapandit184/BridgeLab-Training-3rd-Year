<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <form>

        <label for="country">Country:</label>
        <select id="country" name="country">
            <option selected>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Canada</option>
        </select>

        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option selected>Uttar Pradesh</option>
            <option>Rajasthan</option>
            <option>Goa</option>
            <option>Maharashtra</option>
        </select>

        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option selected>Mathura</option>
            <option>Jaipur</option>
            <option>Goa</option>
            <option>Mumbai</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option selected>Taj Mahal</option>
            <option>Gateway of India</option>
            <option>Amer Fort</option>
            <option>India Gate</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <h2>Your Choices</h2>

    <p>
        You have selected India as your country,
        Uttar Pradesh as your state,
        Mathura as your city,
        and Taj Mahal as your favorite tourist place.
    </p>

</body>
</html>
