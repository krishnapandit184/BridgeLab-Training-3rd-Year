<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the title displayed in the browser tab -->
    <title>Complete Head Elements</title>

    <!-- Sets character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Yuvraj Singh">

    <!-- Sets the base URL for relative URLs -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Style element can contain CSS; left empty as requested -->
    <style>
    </style>

    <!-- Script element is used for JavaScript; left empty as requested -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates important elements used inside the
        HTML head section.
    </p>

</body>

</html>
