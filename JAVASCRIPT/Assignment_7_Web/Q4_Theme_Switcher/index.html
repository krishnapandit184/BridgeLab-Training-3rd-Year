<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <main class="container">
    <h1>Theme Switcher</h1>
    <p>Choose a theme. Theme classes and the data-theme attribute are updated with setAttribute().</p>
    <div class="buttons">
      <button data-theme-choice="light">Light</button>
      <button data-theme-choice="dark">Dark</button>
      <button data-theme-choice="blue">Blue</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
