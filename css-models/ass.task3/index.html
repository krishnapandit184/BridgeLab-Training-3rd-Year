<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>

        <section class="linear-section">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear gradient that changes
                smoothly from one color to another.
            </p>
        </section>

        <section class="radial-section">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial gradient that spreads
                outward from the center.
            </p>
        </section>

    </main>

    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
