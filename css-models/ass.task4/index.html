<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Shadows and Depth Effects</h1>
    </header>

    <main>

        <section class="cards">

            <article class="card shadow-one">
                <h2>Profile Card</h2>
                <p>
                    This card demonstrates a soft box shadow.
                </p>
            </article>

            <article class="card shadow-two">
                <h2>Content Card</h2>
                <p>
                    This card demonstrates a stronger shadow.
                </p>
            </article>

            <article class="card shadow-three">
                <h2>Feature Card</h2>
                <p>
                    This card demonstrates a wide shadow.
                </p>
            </article>

        </section>

    </main>

    <footer>
        <p>CSS Shadow Practice</p>
    </footer>

</body>
</html>
