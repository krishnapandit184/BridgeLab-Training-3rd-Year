<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over each element to view its CSS tooltip.</p>
    </header>

    <main class="tooltip-container">
        <div class="tooltip-item">
            <span class="icon">★</span>
            <span class="tooltip-text">This is a star icon</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">?</span>
            <span class="tooltip-text">This icon provides help</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">!</span>
            <span class="tooltip-text">This indicates attention</span>
        </div>

        <div class="tooltip-item">
            <span class="word">Profile</span>
            <span class="tooltip-text">View your profile</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Tooltip Practice</p>
    </footer>
</body>
</html>
