<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
        <p>A responsive image gallery using CSS Grid.</p>
    </header>

    <main class="gallery">
        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest View</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1018/600/400" alt="Nature scenery">
                <div class="overlay"></div>
            </div>
            <figcaption>Nature Scenery</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
                <div class="overlay"></div>
            </div>
            <figcaption>Animal Portrait</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1035/600/400" alt="River landscape">
                <div class="overlay"></div>
            </div>
            <figcaption>River Landscape</figcaption>
        </figure>

        <figure class="card">
            <div class="image-box">
                <img src="https://picsum.photos/id/1043/600/400" alt="Coastline">
                <div class="overlay"></div>
            </div>
            <figcaption>Coastal View</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Image Showcase Practice</p>
    </footer>
</body>
</html>
