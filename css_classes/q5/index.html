<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS pseudo-classes.</p>
    </header>

    <main class="button-container">
        <button class="btn primary">Primary Button</button>
        <button class="btn secondary">Secondary Button</button>
        <button class="btn outline">Outline Button</button>
        <button class="btn disabled" disabled>Disabled Button</button>
    </main>

    <section class="info">
        <p><strong>:hover</strong> changes a button when the pointer is over it.</p>
        <p><strong>:active</strong> changes a button while it is being pressed.</p>
        <p><strong>:focus</strong> highlights a focused button.</p>
        <p><strong>:disabled</strong> styles the disabled button.</p>
    </section>

    <footer>
        <p>&copy; 2026 Button Collection Practice</p>
    </footer>
</body>
</html>
