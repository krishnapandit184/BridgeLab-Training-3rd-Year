<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Three animated elements created using only CSS.</p>
    </header>

    <main class="animation-area">
        <section class="animation-card">
            <div class="moving-box">MOVE</div>
            <h2>Moving Box</h2>
            <p>Uses animation-direction: alternate.</p>
        </section>

        <section class="animation-card">
            <div class="ball">●</div>
            <h2>Bouncing Ball</h2>
            <p>Uses animation-iteration-count: infinite.</p>
        </section>

        <section class="animation-card">
            <h2 class="changing-text">COLOR CHANGING</h2>
            <p>Uses animation-delay and keyframes.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Animation Practice</p>
    </footer>
</body>
</html>
