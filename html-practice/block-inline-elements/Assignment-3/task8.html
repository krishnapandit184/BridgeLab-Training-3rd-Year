<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>

    <h1 title="School Name">ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1">
        <tr>
            <th rowspan="2" title="Student Information">Student</th>
            <th colspan="5" title="Marks in five subjects">Marks</th>
        </tr>

        <tr>
            <th>English</th>
            <th>Maths</th>
            <th>Science</th>
            <th>Computer</th>
            <th>Hindi</th>
        </tr>

        <tr>
            <td>Yuvraj Singh</td>
            <td>88</td>
            <td>92</td>
            <td>85</td>
            <td>95</td>
            <td>87</td>
        </tr>

        <tr>
            <th colspan="5" title="Total marks">Total</th>
            <td>447</td>
        </tr>

        <tr>
            <th colspan="5" title="Percentage obtained">Percentage</th>
            <td>89.4%</td>
        </tr>
    </table>

</body>
</html>
