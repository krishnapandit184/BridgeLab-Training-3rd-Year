<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Website</title>
</head>

<!-- Frameset divides the page into top and bottom sections -->
<frameset rows="30%,70%">

    <!-- Top frame contains navigation -->
    <frame src="navigation.html" name="navigation">

    <!-- Bottom frame displays welcome message -->
    <frame src="welcome.html" name="content">

</frameset>

</html>
