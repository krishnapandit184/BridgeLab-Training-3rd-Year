<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

    <h1>Upload Image</h1>

    <form>
        <input
            type="file"
            id="image"
            name="image"
            accept=".jpg, .png">

        <br><br>

        <p>Allowed file types: JPG and PNG images only.</p>

        <input type="submit" value="Upload">

    </form>

</body>
</html>
