<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Example</h1>

    <!-- Spaces are encoded using %20 and & is encoded using %26 -->
    <p>
        Encoded URL:
        <a href="https://example.com/search?query=HTML%20%26%20CSS">
            Search HTML &amp; CSS
        </a>
    </p>

</body>
</html>
